name: benchmarks

on: [push, pull_request]

jobs:
    benchmark:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential curl python3

            - name: Run benchmark
              run: make benchmark

            - name: Upload benchmark results
              uses: actions/upload-artifact@v4
              with:
                  name: benchmark-results
                  path: |
                      tests/benchmark_report.md
                      tests/nativejson-benchmark/result/*.csv
                      tests/nativejson-benchmark/result/*.md
                  if-no-files-found: ignore

            - name: Comment benchmark results on PR
              if: github.event_name == 'pull_request'
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');
                      const reportPath = 'tests/benchmark_report.md';
                      let body;
                      if (fs.existsSync(reportPath)) {
                          body = fs.readFileSync(reportPath, 'utf8');
                      } else {
                          body = 'Benchmark report not found.';
                      }
                      const marker = '<!-- benchmark-results -->';
                      body = marker + '\n## Benchmark Results\n\n' + body;

                      const { data: comments } = await github.rest.issues.listComments({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                      });

                      const existing = comments.find(c => c.body && c.body.includes(marker));

                      if (existing) {
                          await github.rest.issues.updateComment({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              comment_id: existing.id,
                              body: body,
                          });
                      } else {
                          await github.rest.issues.createComment({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              issue_number: context.issue.number,
                              body: body,
                          });
                      }
